name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pacman -Syu --noconfirm --needed python pyside6 qt6-declarative ruff python-pytest
      - run: ruff check --select F,E9 .
      - run: python -m py_compile *.py tools/*.py
      - name: qmllint
        run: |
          set -euo pipefail
          lint="$(command -v pyside6-qmllint || echo /usr/lib/qt6/bin/qmllint)"
          "$lint" -I qml qml/*.qml
      - run: QT_QPA_PLATFORM=offscreen python -c "import backend, desktops, engine, checks"
      - run: QT_QPA_PLATFORM=offscreen timeout 600 python -m pytest -q tests

  screenshots:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Fiordland-Linux/fiordland
          path: fiordland
          persist-credentials: false
          sparse-checkout: packages/fiordland-desktop/files
          sparse-checkout-cone-mode: true
      - run: pacman -Syu --noconfirm --needed python pyside6 qt6-declarative inter-font ttf-jetbrains-mono ttf-material-symbols-variable
      - name: capture
        env:
          RAWARU_WALLPAPER: ${{ github.workspace }}/fiordland/packages/fiordland-desktop/files/wallpaper.png
        run: |
          set -euo pipefail
          timeout 240 python tools/shots.py --out shots --size 1024x768
          timeout 120 python tools/shots.py --out shots --size 1440x900 --prefix wide- --only 01-welcome,05-disk-alongside,10-desktop-wm,12-summary,16-progress-log
          RAWARU_LOW_END=1 timeout 120 python tools/shots.py --out shots --prefix lowend- --settle 0.5 --only 01-welcome,04-disk-erase,09-desktop,15-progress
          QT_SCALE_FACTOR=2 timeout 120 python tools/shots.py --out shots --prefix hidpi- --only 02-region,07-account,12-summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: warn
